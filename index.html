<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .heatmap-container {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .heatmap-container img {
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
        }
        .heatmap-container img:hover {
            transform: scale(1.05);
        }
        .zone-card {
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            color: white;
        }
        .zone-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.2);
        }
        .cold-zone { background: #00bcd4; }
        .normal-zone { background: #4caf50; }
        .hot-zone { background: #ff5722; }
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4"><i class="fas fa-thermometer-half"></i> Warehouse Temperature Zoning Dashboard</h2>

        <div class="heatmap-container fade-in">
            <h4>Temperature Efficiency Heatmap</h4>
            <img id="heatmap" src="data:image/png;base64,{{ heatmap_url }}" class="img-fluid border rounded" alt="Heatmap">
        </div>

        <h4 class="mt-4 text-center"><i class="fas fa-chart-line"></i> Zone Efficiency Scores</h4>
        <div class="row mt-3" id="zone-cards">
            {% for zone in temp_zones %}
            <div class="col-md-4 mb-3 fade-in">
                <div class="card zone-card shadow-sm p-3 
                    {% if zone.efficiency_score < 40 %} cold-zone 
                    {% elif zone.efficiency_score < 70 %} normal-zone 
                    {% else %} hot-zone {% endif %}">
                    <h5 class="card-title text-center"><i class="fas fa-temperature-high"></i> {{ zone.zone_id }}</h5>
                    <p class="card-text text-center">Efficiency Score: <strong>{{ zone.efficiency_score|round(2) }}</strong></p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function refreshData() {
            $.getJSON("/data", function(data) {
                let zoneCards = "";
                data.temp_zones.forEach(zone => {
                    let zoneClass = zone.efficiency_score < 40 ? "cold-zone" : 
                                    (zone.efficiency_score < 70 ? "normal-zone" : "hot-zone");
                    
                    zoneCards += `<div class="col-md-4 mb-3 fade-in">
                                    <div class="card zone-card shadow-sm p-3 ${zoneClass}">
                                        <h5 class="card-title text-center"><i class="fas fa-temperature-high"></i> ${zone.zone_id}</h5>
                                        <p class="card-text text-center">Efficiency Score: <strong>${zone.efficiency_score.toFixed(2)}</strong></p>
                                    </div>
                                </div>`;
                });
                $("#zone-cards").html(zoneCards);
                $("#heatmap").attr("src", "data:image/png;base64," + data.heatmap_url);
            });
        }

        setInterval(refreshData, 60000);
    </script>
</body>
</html>
